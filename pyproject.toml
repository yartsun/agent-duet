[project]
name = "agent-duet"
version = "0.1.0"
description = "Run Codex and Claude Code as a builder/reviewer pair: local task queue, isolated git worktrees, cross-review, checks and a dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bohdan Yartsun" }]
keywords = ["ai-agents", "claude-code", "codex", "orchestration", "code-review", "git-worktree"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yartsun/agent-duet"

[project.scripts]
duet = "duet.__main__:run"
duet-web = "duet.web:main"
duet-coord = "duet.coord:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duet"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023", "F841"]
